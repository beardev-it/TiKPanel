services:
  tikpanel:
    build: .
    image: tikpanel:latest
    container_name: tikpanel
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      # Utenti/ruoli della dashboard (app/users.py): senza volume dedicato, ricreare il
      # container (es. dopo un aggiornamento immagine) cancellerebbe tutti gli utenti.
      - tikpanel-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  tikpanel-data:
